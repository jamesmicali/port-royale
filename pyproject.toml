[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portroyale"
version = "0.1.0"
description = "Casino game strategy builder and Monte Carlo simulator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "streamlit",
    "plotly",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
portroyale = "portroyale.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
